services:
  db:
    image: postgres:16-alpine
    container_name: ogma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogma
      POSTGRES_PASSWORD: ogma
      POSTGRES_DB: ogma
    ports:
      - "5432:5432"
    volumes:
      - ogma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogma -d ogma"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ogma-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://ogma:ogma@db:5432/ogma
      API_CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000
      REMOTIVE_ENABLED: "true"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ogma_pgdata:
