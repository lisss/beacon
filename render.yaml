services:
  - type: web
    name: ogma
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: API_CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        # Ephemeral on free tier (resets when the service sleeps/redeploys)
        value: sqlite:////tmp/ogma.db
